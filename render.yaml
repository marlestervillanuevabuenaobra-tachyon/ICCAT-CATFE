# Optional "Blueprint": lets you create the database + web service in one click.
# (New → Blueprint → pick your GitHub repo). The manual steps in RENDER_DEPLOY.md work too.
databases:
  - name: catfe-db
    databaseName: catfe_db
    user: catfe_user
    plan: free

services:
  - type: web
    name: catfe
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: catfe-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false        # you type this in the Render dashboard
